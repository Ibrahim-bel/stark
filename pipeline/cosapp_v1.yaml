            <1-hop> extend_rows_3d is a method of FluidMachineryBase that iterates
            over all bladed rows registered in the assembly and delegates 3D blade
            generation to the extend_3d method, automatically determining the correct
            extension strategy based on the aerodynamic nature of each row. The method
            iterates over self.aero.rows_info, which yields pairs of (row_name,
            is_rotating) for each bladed row. For each row, it evaluates the
            is_rotating flag to select the appropriate Extend2dMode.
