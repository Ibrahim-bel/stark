            <2-hop> Valid aerodynamic state data must be available in self.aero before
            calling this method, as the velocity triangle calculations depend on current
            values of fl_in.Vm, fl_out.Vm, psi, rpm, and fl_in.Vu. The extend_3d
            operation completely rebuilds the sections of the target blade, discarding
            any previously defined section configurations. The spans list should include
            0.0 and 1.0 to define hub and shroud sections respectively; intermediate
            values generate sections named according to the getSectionNameFromSpan
