        query: >
          How does the extend_rows_3d method automatically determine the correct
          blade extension strategy for each bladed row in the assembly, and what
          aerodynamic state data must be available before the extend_3d method can
          properly generate 3D blade geometry using the ConstantPsi mode for
          rotating blade rows?
        answer: >
          extend_rows_3d iterates over self.aero.rows_info, yielding (row_name,
          is_rotating) pairs. For each row it assigns Extend2dMode.ConstantPsi when
          is_rotating is True (rotor) or Extend2dMode.Extrude when False (stator),
          then calls extend_3d with the row name, mode, and shared spans list.
          Before extend_3d can generate 3D geometry in ConstantPsi mode, valid
          aerodynamic state data must be present in self.aero: fl_in.Vm, fl_out.Vm,
          psi, rpm, and fl_in.Vu. The spans list must include 0.0 and 1.0 for hub
          and shroud; the operation discards any prior section configurations.

